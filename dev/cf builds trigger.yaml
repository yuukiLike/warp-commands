---
name: cf builds trigger
command: "curl -sS -X PATCH\n\n-H \"Authorization: Bearer {{apiToken}}\"\n\n-H \"Content-Type: application/json\"\n\n\"https://api.cloudflare.com/client/v4/accounts/{{account}}/builds/triggers/{{trigger}}\"\n\n-d '{\"build_token_uuid\":\"{{buildTokenUuid}}\",\"branch_includes\":[\"{{includes}}\"],\"branch_excludes\":[\"{{excludes}}\"]}'"
description: 更新 Cloudflare Workers Builds trigger 的分支规则。preview 的 includes 只能是 *，不能写 preview/*。account 用 cf account，trigger 用 cf trigger id。apiToken 填入后会出现在执行的命令中。
arguments:
  - name: apiToken
    arg_type: Text
    description: 用户级 API Token，需要 Workers Builds Configuration Edit。
    default_value: ~
  - name: account
    arg_type: Text
    description: 账户 ID。先运行 cf account，或从 Workers & Pages / 地址栏复制。
    default_value: ~
  - name: trigger
    arg_type: Text
    description: trigger UUID。先运行 cf trigger id；含 main 的是 production，另一条是 preview。
    default_value: ~
  - name: buildTokenUuid
    arg_type: Text
    description: "官方文档还未更新的 https://github.com/cloudflare/cloudflare-docs/pull/30065"
    default_value: ~
  - name: includes
    arg_type: Text
    description: branch_includes。preview 只能填 *；production 填精确分支名。不要填 preview/*。
    default_value: "*"
  - name: excludes
    arg_type: Text
    description: branch_excludes 中的一条精确分支名。preview 至少排除 production 分支。
    default_value: main
tags: []
source_url: ~
author: ~
author_url: ~
shells: []
