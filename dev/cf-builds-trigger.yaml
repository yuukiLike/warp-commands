---
# 顺序：cf account → cf worker tag → cf trigger id → 本命令。
# 实测：Workers Builds 不接受 preview/* 这类 glob，会 12002。
# preview trigger 的 includes 只能是 *；excludes 可以是精确分支名（可含 /）。
# production trigger 的 includes 只能是一条精确分支名，例如 main。
# https://developers.cloudflare.com/api/resources/workers_builds/subresources/triggers/methods/update/
name: "cf builds trigger"
command: |-
  curl -sS -X PATCH \
    -H "Authorization: Bearer {{apiToken}}" \
    -H "Content-Type: application/json" \
    "https://api.cloudflare.com/client/v4/accounts/{{account}}/builds/triggers/{{trigger}}" \
    -d '{"branch_includes":["{{includes}}"],"branch_excludes":["{{excludes}}"]}'
description: "更新 Cloudflare Workers Builds trigger 的分支规则。preview 的 includes 只能是 *，不能写 preview/*。account 用 cf account，trigger 用 cf trigger id。apiToken 填入后会出现在执行的命令中。"
arguments:
  - name: "apiToken"
    arg_type: "Text"
    description: "用户级 API Token，需要 Workers Builds Configuration Edit。"
    default_value: null
  - name: "account"
    arg_type: "Text"
    description: "账户 ID。先运行 cf account，或从 Workers & Pages / 地址栏复制。"
    default_value: null
  - name: "trigger"
    arg_type: "Text"
    description: "trigger UUID。先运行 cf trigger id；含 main 的是 production，另一条是 preview。"
    default_value: null
  - name: "includes"
    arg_type: "Text"
    description: "branch_includes。preview 只能填 *；production 填精确分支名。不要填 preview/*。"
    default_value: "*"
  - name: "excludes"
    arg_type: "Text"
    description: "branch_excludes 中的一条精确分支名。preview 至少排除 production 分支。"
    default_value: "main"
tags: ["cloudflare", "workers", "builds"]
shells: []
source_url: "https://developers.cloudflare.com/api/resources/workers_builds/subresources/triggers/methods/update/"
