---
name: "pi settings"
command: 'mkdir -p "${PI_CODING_AGENT_DIR:-$HOME/.pi/agent}" && vi "${PI_CODING_AGENT_DIR:-$HOME/.pi/agent}/settings.json"'
description: "用 vi 手动编辑用户 settings.json；按 i 编辑，Esc 后输入 :wq 保存退出。一键配置可用 pi settings overwrite（覆盖）或 pi settings merge（增量），均不备份。默认目录 ~/.pi/agent，支持 PI_CODING_AGENT_DIR；验证默认值时退出后重新运行 pi。"
arguments: []
tags: ["pi", "settings", "config", "models", "thinking"]
source_url: "https://pi.dev/docs/latest/configuration"
shells: ["bash", "zsh"]
