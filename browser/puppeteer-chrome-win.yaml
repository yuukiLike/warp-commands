---
name: "puppeteer chrome win"
command: |-
  $chromePath = "{{chrome_path}}"
  if (-not (Test-Path -LiteralPath $chromePath -PathType Leaf)) {
    throw "Chrome executable not found: $chromePath"
  }
  $env:PUPPETEER_EXECUTABLE_PATH = $chromePath
  $env:PUPPETEER_SKIP_DOWNLOAD = "true"
description: "在当前 PowerShell 会话中让 Puppeteer 使用已有的 Chrome 并跳过下载。Canary 路径可用 $env:LOCALAPPDATA\\Google\\Chrome SxS\\Application\\chrome.exe。"
arguments:
  - name: "chrome_path"
    arg_type: "Text"
    description: "Chrome 可执行文件的路径。"
    default_value: "$env:ProgramFiles\\Google\\Chrome\\Application\\chrome.exe"
tags: ["puppeteer", "browser", "windows", "powershell"]
shells: []
