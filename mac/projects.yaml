---
name: "projects"
command: |-
  if ! typeset -f projects >/dev/null 2>&1; then
    printf '%s\n' '请先在 Warp 中运行 setup projects 工作流。' >&2
    false
  else
    projects "{{directory}}"
  fi
description: "调用安装好的 projects 命令，用 eza 查看项目名称、Git 分支和状态。先在 Warp 中运行 setup projects。默认 ~/codex，支持空格并排除 node_modules。"
arguments:
  - name: "directory"
    arg_type: "Text"
    description: "项目所在的父目录，默认 ~/codex，也可填写绝对路径。"
    default_value: "$HOME/codex"
tags: ["projects", "git", "eza", "development"]
shells: ["zsh"]
