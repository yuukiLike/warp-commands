---
# 查看当前设置：defaults read com.apple.finder ShowPathbar
# 1 表示显示，0 表示隐藏；键不存在表示使用系统默认值。
# true 显示路径栏，false 隐藏；执行后重启 Finder。
name: "mac finder pathbar"
command: 'defaults write com.apple.finder ShowPathbar -bool "{{enabled}}" && killall Finder'
description: "显示或隐藏 Finder 窗口底部的路径栏，便于查看目录层级和复制路径。默认显示，执行后重启 Finder。"
arguments:
  - name: "enabled"
    arg_type: "Text"
    description: "true 显示路径栏；false 隐藏。"
    default_value: "true"
tags: ["macos", "finder", "path", "system"]
shells: ["bash", "zsh"]
