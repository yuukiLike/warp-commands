---
# 用 Worker 名字找到 tag。Builds API 要 tag，不要用名字。
# 下一步：cf trigger id
# https://developers.cloudflare.com/workers/ci-cd/builds/api-reference/
name: "cf worker tag"
command: |-
  curl -sS -H "Authorization: Bearer {{apiToken}}" \
    "https://api.cloudflare.com/client/v4/accounts/{{account}}/workers/scripts"
description: "列出账户下 Worker 的名字和 tag。下一步用 cf trigger id。apiToken 填入后会出现在执行的命令中。"
arguments:
  - name: "apiToken"
    arg_type: "Text"
    description: "用户级 API Token，需要 Workers Scripts Read。"
    default_value: null
  - name: "account"
    arg_type: "Text"
    description: "账户 ID。先运行 cf account，或从 Workers & Pages / 地址栏复制。"
    default_value: null
tags: ["cloudflare", "workers", "builds"]
shells: []
source_url: "https://developers.cloudflare.com/api/resources/workers/subresources/scripts/methods/list/"
